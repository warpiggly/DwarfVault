<html lang="en">

    <title>Dott-y - Tables</title>

    <div style="padding: 10px;">
        <div id="tablesContainer">

            <p style="color: #f4e5c3; font-family: 'Righteous-Regular', sans-serif; text-align: center;">Loading databases...</p>
